<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14142A"/>
      <stop offset="55%" stop-color="#0B0B1A"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <linearGradient id="petalR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF3B5C"/><stop offset="100%" stop-color="#FF8A3C"/>
    </linearGradient>
    <linearGradient id="petalG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD84C"/><stop offset="100%" stop-color="#5CE87A"/>
    </linearGradient>
    <linearGradient id="petalB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CD9FF"/><stop offset="100%" stop-color="#3C7BFF"/>
    </linearGradient>
    <linearGradient id="petalV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B6CFF"/><stop offset="100%" stop-color="#FF5CD0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5DE9C"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- rainbow bloom: four rainbow petals over a gold orbit ring -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.75"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.45"/>

  <g>
    <path d="M256 196 C 214 156 214 96 256 44 C 298 96 298 156 256 196 Z" fill="url(#petalR)" opacity="0.9"/>
    <path d="M256 196 C 214 156 214 96 256 44 C 298 96 298 156 256 196 Z" fill="url(#petalG)" opacity="0.9" transform="rotate(90 256 256)"/>
    <path d="M256 196 C 214 156 214 96 256 44 C 298 96 298 156 256 196 Z" fill="url(#petalB)" opacity="0.9" transform="rotate(180 256 256)"/>
    <path d="M256 196 C 214 156 214 96 256 44 C 298 96 298 156 256 196 Z" fill="url(#petalV)" opacity="0.9" transform="rotate(270 256 256)"/>
  </g>

  <!-- golden vintage microphone: star at the center of the bloom -->
  <g>
    <!-- grille head with slats -->
    <rect x="232" y="176" width="48" height="86" rx="24" fill="url(#gold)"/>
    <g stroke="#6B5417" stroke-width="3" opacity="0.65">
      <line x1="236" y1="200" x2="276" y2="200"/>
      <line x1="234" y1="218" x2="278" y2="218"/>
      <line x1="234" y1="236" x2="278" y2="236"/>
      <line x1="236" y1="254" x2="276" y2="254"/>
    </g>
    <!-- yoke ring -->
    <path d="M204 226 a52 52 0 0 0 104 0" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <!-- tapered vintage body + base -->
    <path d="M249 316 L263 316 L259 356 L253 356 Z" fill="url(#gold)"/>
    <rect x="244" y="360" width="24" height="9" rx="4" fill="url(#gold)"/>
    <line x1="256" y1="300" x2="256" y2="314" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
