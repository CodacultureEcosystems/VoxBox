<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#141B2E"/>
      <stop offset="55%" stop-color="#0D1224"/>
      <stop offset="100%" stop-color="#06081A"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F2FA"/>
      <stop offset="50%" stop-color="#B9C2D8"/>
      <stop offset="100%" stop-color="#828BA8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- binding ring, faint silver -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#8790AD" stroke-width="2" opacity="0.35"/>

  <!-- mercury crescent: cradles the orb, horns upward -->
  <path d="M196 168 a60 60 0 0 0 120 0" fill="none" stroke="#E8C766" stroke-width="8" stroke-linecap="round"/>
  <!-- mercurial orb -->
  <circle cx="256" cy="120" r="15" fill="#E8C766"/>
  <circle cx="256" cy="120" r="15" fill="none" stroke="#F1D488" stroke-width="2"/>

  <!-- microphone capsule: silver, sits under the crescent like a vessel -->
  <rect x="230" y="176" width="52" height="128" rx="26" fill="url(#silver)"/>
  <path d="M206 246 a50 50 0 0 0 100 0" fill="none" stroke="url(#silver)" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="314" x2="256" y2="332" stroke="url(#silver)" stroke-width="7" stroke-linecap="round"/>
  <line x1="234" y1="334" x2="278" y2="334" stroke="url(#silver)" stroke-width="7" stroke-linecap="round"/>

  <!-- breath arcs: the vapor that transmutes -->
  <g stroke="#8B93B0" stroke-width="4.5" stroke-linecap="round" opacity="0.85">
    <path d="M356 206 a104 104 0 0 1 0 100"/>
    <path d="M396 182 a160 160 0 0 1 0 148"/>
    <path d="M156 206 a104 104 0 0 0 0 100"/>
    <path d="M116 182 a160 160 0 0 0 0 148"/>
  </g>

  <!-- salt dots -->
  <g fill="#E8C766">
    <circle cx="256" cy="446" r="5" opacity="0.9"/>
    <circle cx="196" cy="436" r="3.5" opacity="0.55"/>
    <circle cx="316" cy="436" r="3.5" opacity="0.55"/>
  </g>
</svg>
