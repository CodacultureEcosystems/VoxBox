<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#1C2340"/>
      <stop offset="55%" stop-color="#10142A"/>
      <stop offset="100%" stop-color="#07091A"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1D488"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1D488"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8842A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- binding circle -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.9"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="#D4AF37" stroke-width="1.6" opacity="0.45"/>

  <!-- fire triangle (upward, inscribed) -->
  <polygon points="256,96 380,336 132,336" fill="none" stroke="url(#gold)" stroke-width="4.5" opacity="0.95" stroke-linejoin="round"/>

  <!-- earth triangle (downward, faint) — the great seal -->
  <polygon points="256,382 150,182 362,182" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.28"/>

  <!-- microphone capsule: the prima materia at the seal's heart -->
  <rect x="232" y="150" width="48" height="130" rx="24" fill="url(#capsule)"/>
  <path d="M212 240 a44 44 0 0 0 88 0" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="287" x2="256" y2="308" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <line x1="236" y1="310" x2="276" y2="310" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>

  <!-- waveform: voice rising inside the triangle, gold -->

  <g stroke="#E8C766" stroke-width="5" stroke-linecap="round" opacity="0.95">
    <line x1="206" y1="368" x2="206" y2="356"/>
    <line x1="228" y1="374" x2="228" y2="350"/>
    <line x1="250" y1="378" x2="250" y2="346"/>
    <line x1="272" y1="372" x2="272" y2="352"/>
    <line x1="294" y1="366" x2="294" y2="358"/>
  </g>

  <!-- orbit dots: the seven planets -->
  <g fill="#F1D488">
    <circle cx="256" cy="60" r="5"/>
    <circle cx="428" cy="380" r="4" opacity="0.75"/>
    <circle cx="84" cy="380" r="4" opacity="0.75"/>
    <circle cx="452" cy="256" r="3.5" opacity="0.5"/>
    <circle cx="60" cy="256" r="3.5" opacity="0.5"/>
  </g>
</svg>
