<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="64%">
      <stop offset="0%" stop-color="#101A1C"/>
      <stop offset="55%" stop-color="#0A1114"/>
      <stop offset="100%" stop-color="#040A0C"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- flower of life: seven circles, verdigris line art -->
  <g fill="none" stroke="#6FA98C" stroke-width="1.8" opacity="0.65">
    <circle cx="256" cy="256" r="118"/>
    <circle cx="256" cy="154" r="118"/>
    <circle cx="256" cy="358" r="118"/>
    <circle cx="153.8" cy="197" r="118"/>
    <circle cx="358.2" cy="197" r="118"/>
    <circle cx="153.8" cy="315" r="118"/>
    <circle cx="358.2" cy="315" r="118"/>
  </g>

  <!-- enclosing vesica arcs, gold -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#D4AF37" stroke-width="5" opacity="0.9"/>
  <circle cx="256" cy="256" r="191" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.4"/>

  <!-- microphone: the seed at the flower's heart -->
  <rect x="238" y="188" width="36" height="102" rx="18" fill="#E8C766"/>
  <path d="M218 256 a38 38 0 0 0 76 0" fill="none" stroke="#E8C766" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="256" y1="300" x2="256" y2="316" stroke="#E8C766" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="238" y1="318" x2="274" y2="318" stroke="#E8C766" stroke-width="5.5" stroke-linecap="round"/>

  <!-- waveform petals: voice made geometric -->
  <g stroke="#E8C766" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="336" y1="238" x2="336" y2="274"/>
    <line x1="358" y1="224" x2="358" y2="288"/>
    <line x1="380" y1="238" x2="380" y2="274"/>
    <line x1="176" y1="238" x2="176" y2="274"/>
    <line x1="154" y1="224" x2="154" y2="288"/>
    <line x1="132" y1="238" x2="132" y2="274"/>
  </g>
</svg>
