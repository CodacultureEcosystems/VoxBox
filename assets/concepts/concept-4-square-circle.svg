<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A1420"/>
      <stop offset="55%" stop-color="#100C18"/>
      <stop offset="100%" stop-color="#070510"/>
    </radialGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1D488"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B24"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- squaring the circle: earth, heaven, voice -->
  <rect x="118" y="118" width="276" height="276" fill="none" stroke="#9A7B24" stroke-width="3" opacity="0.55" rx="10"/>
  <rect x="132" y="132" width="248" height="248" fill="none" stroke="#9A7B24" stroke-width="1.4" opacity="0.3" rx="8"/>

  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#rose)" stroke-width="4.5" opacity="0.95"/>
  <polygon points="256,124 176,336 336,336" fill="none" stroke="#E8C766" stroke-width="3" opacity="0.7" stroke-linejoin="round"/>

  <!-- rising mic capsule -->
  <rect x="236" y="170" width="40" height="118" rx="20" fill="url(#rose)"/>
  <path d="M216 258 a40 40 0 0 0 80 0" fill="none" stroke="url(#rose)" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="304" x2="256" y2="322" stroke="url(#rose)" stroke-width="6" stroke-linecap="round"/>
  <line x1="236" y1="324" x2="276" y2="324" stroke="url(#rose)" stroke-width="6" stroke-linecap="round"/>

  <!-- rising bars: transmutation, base to fire -->
  <g fill="#E8C766" opacity="0.92">
    <rect x="196" y="376" width="9" height="26" rx="4"/>
    <rect x="222" y="368" width="9" height="34" rx="4"/>
    <rect x="248" y="358" width="9" height="44" rx="4"/>
    <rect x="274" y="368" width="9" height="34" rx="4"/>
    <rect x="300" y="376" width="9" height="26" rx="4"/>
    <rect x="256" y="418" width="1" height="1" opacity="0"/>
  </g>

  <!-- star point at apex -->
  <circle cx="256" cy="118" r="6" fill="#F1D488"/>
</svg>
