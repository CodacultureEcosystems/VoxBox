<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="mg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#06170C"/>
      <stop offset="55%" stop-color="#04120A"/>
      <stop offset="100%" stop-color="#020B06"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8FFCC"/>
      <stop offset="45%" stop-color="#39FF6E"/>
      <stop offset="100%" stop-color="#0E7A2E"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0B285"/>
      <stop offset="45%" stop-color="#C87F4A"/>
      <stop offset="100%" stop-color="#7A4521"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#mg)"/>

  <!-- matrix code rain: faint vertical glyph trails -->
  <g fill="#39FF6E" opacity="0.16">
    <circle cx="120" cy="90" r="3.2"/><circle cx="120" cy="118" r="2.6"/>
    <circle cx="188" cy="56" r="3.2"/><circle cx="188" cy="82" r="2.6"/>
    <circle cx="256" cy="72" r="2.6"/><circle cx="256" cy="98" r="2.2"/>
    <circle cx="324" cy="58" r="3.2"/><circle cx="324" cy="86" r="2.6"/>
    <circle cx="392" cy="88" r="3.2"/><circle cx="392" cy="116" r="2.6"/>
    <circle cx="102" cy="400" r="2.8"/><circle cx="150" cy="428" r="3.4"/>
    <circle cx="238" cy="418" r="3.4"/><circle cx="318" cy="430" r="2.8"/>
    <circle cx="398" cy="408" r="2.8"/><circle cx="452" cy="376" r="2.2"/>
  </g>

  <!-- reticle ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#39FF6E" stroke-width="3" opacity="0.55"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="#39FF6E" stroke-width="1.2" opacity="0.25"/>

  <!-- the waveform, matrix green: amplitude bars center-aligned -->
  <g fill="url(#wave)">
    <rect x="128" y="242" width="14" height="28"  rx="5"/>
    <rect x="156" y="222" width="14" height="68"  rx="5"/>
    <rect x="184" y="196" width="14" height="120" rx="5"/>
    <rect x="212" y="168" width="14" height="176" rx="5"/>
    <rect x="240" y="150" width="14" height="212" rx="5" opacity="0.95"/>
    <rect x="268" y="160" width="14" height="192" rx="5"/>
    <rect x="296" y="186" width="14" height="140" rx="5"/>
    <rect x="324" y="212" width="14" height="88"  rx="5"/>
    <rect x="352" y="230" width="14" height="52"  rx="5"/>
    <rect x="380" y="246" width="14" height="20"  rx="5"/>
  </g>

  <!-- caret blink: the cursor is alive -->
  <rect x="420" y="236" width="9" height="40" rx="2" fill="#C8FFD8"/>

  <!-- contrast void: falls behind the mic so its silhouette stays crisp -->
  <circle cx="256" cy="256" r="108" fill="#04120A" opacity="0.92"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="#C87F4A" stroke-width="1.6" opacity="0.5"/>

  <!-- copper vintage microphone: grating, yoke, tapered body -->
  <g>
    <rect x="232" y="186" width="48" height="86" rx="24" fill="url(#copper)"/>
    <g stroke="#4A2A0F" stroke-width="3" opacity="0.7">
      <line x1="236" y1="210" x2="276" y2="210"/>
      <line x1="234" y1="228" x2="278" y2="228"/>
      <line x1="234" y1="246" x2="278" y2="246"/>
      <line x1="236" y1="264" x2="276" y2="264"/>
    </g>
    <path d="M204 234 a52 52 0 0 0 104 0" fill="none" stroke="url(#copper)" stroke-width="7" stroke-linecap="round"/>
    <line x1="256" y1="300" x2="256" y2="314" stroke="url(#copper)" stroke-width="6" stroke-linecap="round"/>
    <path d="M249 312 L263 312 L259 350 L253 350 Z" fill="url(#copper)"/>
    <rect x="244" y="354" width="24" height="9" rx="4" fill="url(#copper)"/>
  </g>
</svg>
