<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="VoxBox logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1023"/>
      <stop offset="55%" stop-color="#141B3C"/>
      <stop offset="100%" stop-color="#1E1440"/>
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="104" fill="none"
        stroke="#818CF8" stroke-opacity="0.35" stroke-width="3"/>

  <!-- microphone capsule -->
  <rect x="226" y="106" width="60" height="156" rx="30" fill="url(#mic)"/>
  <rect x="238" y="122" width="12" height="80" rx="6" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- yoke + stand -->
  <path d="M 184 218 A 72 72 0 0 0 328 218"
        fill="none" stroke="#CBD5E1" stroke-width="22" stroke-linecap="round"/>
  <path d="M 256 290 L 256 336"
        stroke="#CBD5E1" stroke-width="22" stroke-linecap="round"/>
  <path d="M 192 344 L 320 344"
        stroke="#CBD5E1" stroke-width="22" stroke-linecap="round"/>

  <!-- waveform -->
  <g fill="url(#wave)">
    <rect x="76"  y="416" width="16" height="26"  rx="8"/>
    <rect x="112" y="402" width="16" height="54"  rx="8"/>
    <rect x="148" y="382" width="16" height="94"  rx="8"/>
    <rect x="184" y="408" width="16" height="42"  rx="8"/>
    <rect x="220" y="372" width="16" height="114" rx="8"/>
    <rect x="256" y="390" width="16" height="78"  rx="8"/>
    <rect x="292" y="366" width="16" height="126" rx="8"/>
    <rect x="328" y="402" width="16" height="54"  rx="8"/>
    <rect x="364" y="378" width="16" height="102" rx="8"/>
    <rect x="400" y="412" width="16" height="34"  rx="8"/>
    <rect x="436" y="420" width="16" height="18"  rx="8"/>
  </g>
</svg>
