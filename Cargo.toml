[package]
name = "voxbox"
version = "0.1.0"
edition = "2021"
description = "Voice-first shell for Linux: local Whisper STT, spoken replies, safe command execution."
license = "MIT"

[[bin]]
name = "voxbox"
path = "src/main.rs"

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
ureq = { version = "2", features = ["json"] }
whisper-rs = { version = "0.16", optional = true }

[profile.release]
lto = "thin"
