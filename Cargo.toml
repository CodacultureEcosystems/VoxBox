[package]
name = "voxbox"
version = "0.2.0"
edition = "2021"
description = "VoxBox Station: local Whisper STT, system-wide dictation (vbd), spoken replies, safe command execution."
license = "MIT OR Apache-2.0"

[[bin]]
name = "voxbox"
path = "src/main.rs"

[[bin]]
name = "vbd"
path = "src/bin/vbd.rs"

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
dirs = "5"
ureq = { version = "2", features = ["json"] }
whisper-rs = { version = "0.16", optional = true }

[profile.release]
lto = "thin"
