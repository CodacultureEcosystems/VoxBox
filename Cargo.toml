[package]
name = "voxbox"
version = "0.3.1"
edition = "2021"
description = "VoxBox Station: local Whisper STT, system-wide dictation (vbd), spoken replies, safe command execution."
license = "MIT OR Apache-2.0"

[[bin]]
name = "voxbox"
path = "src/main.rs"

[[bin]]
name = "vbd"
path = "src/bin/vbd.rs"

[features]
default = ["whisper", "parakeet"]
whisper = ["dep:whisper-rs"]
parakeet = ["dep:parakeet-rs"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
dirs = "5"
ureq = { version = "2", features = ["json"] }
whisper-rs = { version = "0.16", optional = true }
parakeet-rs = { version = "0.4.4", optional = true, default-features = false, features = ["burn"] }
ksni = { version = "0.3.7", features = ["blocking"] }
png = "0.18"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[profile.release]
lto = "thin"
